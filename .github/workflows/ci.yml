name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-title:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Validate title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'NODE'
          const title = process.env.PULL_REQUEST_TITLE ?? "";
          const conventionalCommit = /^[a-z][a-z0-9-]*(?:\([^)]+\))?!?: \S.*$/;

          if (!conventionalCommit.test(title)) {
            console.error(
              `Pull request title must use Conventional Commit syntax, for example "fix: parse additional USPS suffixes". Received: ${JSON.stringify(title)}`,
            );
            process.exit(1);
          }
          NODE

  quality:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Run package quality gate
        run: npm run check

      - name: Install browser for research explorer checks
        run: npx playwright install --with-deps --only-shell chromium

      - name: Verify the generated research explorer
        run: npm run test:research-ui

      - name: Verify the human labeling workflow
        run: npm run test:review-ui

      - name: Use minimum supported runtime
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Verify packed consumers on Node.js 18
        run: npm run test:package
