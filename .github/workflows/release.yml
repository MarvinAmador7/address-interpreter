name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Verify tag and package versions agree
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import packageJson from "./package.json" with { type: "json" };

          const expectedTag = `v${packageJson.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `Release tag ${process.env.RELEASE_TAG} does not match package ${expectedTag}`,
            );
          }
          if (process.env.RELEASE_VERSION !== packageJson.version) {
            throw new Error(
              `Release version ${process.env.RELEASE_VERSION} does not match package ${packageJson.version}`,
            );
          }
          NODE

      - name: Run package quality gate
        run: npm run check

      - name: Publish with npm trusted publishing
        run: npm publish --access public
